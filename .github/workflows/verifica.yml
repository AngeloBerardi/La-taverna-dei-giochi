# Controlla ogni ramo e ogni richiesta di unione: build, sintassi, struttura e test rapidi (stessi controlli di `npm run verifica`).
name: Verifica
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm run verifica
  # Le stesse regole provate sull'emulatore vero di Firebase (non blocca la verifica se l'emulatore non parte)
  emulatore:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm run test:emulatore
