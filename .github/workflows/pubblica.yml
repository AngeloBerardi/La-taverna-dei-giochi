# Pubblica a ogni unione in main (serve il segreto FIREBASE_SERVICE_ACCOUNT, vedi docs/HOSTING.md):
# 1) test, 2) regole del database e di Firestore, 3) sito. Le regole vanno PRIMA del sito: il sito nuovo si aspetta le regole nuove.
name: Pubblica
on:
  push:
    branches: [main]
jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm run verifica
      - name: Regole di Realtime Database e Firestore
        id: regole
        continue-on-error: true
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@13 deploy --only database,firestore:rules --project la-taverna-dei-giochi --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Avviso se le regole non sono state pubblicate
        if: steps.regole.outcome == 'failure'
        run: echo "::warning::Le regole NON sono state pubblicate. Di solito manca il permesso Firebase Rules Admin all'account di servizio, pubblicale a mano dalla console."
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: la-taverna-dei-giochi
