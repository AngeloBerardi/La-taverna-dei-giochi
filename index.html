<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Regicide</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;800;900&family=Nunito:wght@600;800;900&family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
/* Layout: tavolo verticale per telefono. In alto il nemico come ritratto con gemme (attacco/vita), ai lati le pile; sotto il campo di battaglia, i giocatori, il narratore, i comandi e la mano a ventaglio fissata in basso. */
:root{--bg:#0d1a1c;--s1:#1d5e52;--s2:#6e1f2c;--s3:#123c48;--panel:rgba(9,16,20,.72);--line:rgba(232,196,110,.28);--fg:#fbf1dc;--muted:#a8bdb6;--accent:#e9c46a;--accent-fg:#2a1d03;--gold1:#fff1b8;--gold2:#d9a93a;--gold3:#7a5410;
--cardbg:#fbf4e2;--cardedge:#3a2a14;--ink:#1d1a22;--red:#c8262f;--blk:#1d1a22;--good:#6fe39a;--bad:#ff6a57;--faceA:#f4e6c4;--faceB:#d9b66a;--cb:#6a1a24;--cb2:#3e0e15;
--f-t:'Cinzel Decorative','Cinzel',Georgia,serif;--f-d:'Cinzel',Georgia,serif;--f-b:'Nunito','Trebuchet MS',sans-serif;color-scheme:dark}
[data-gt=castello]{--bg:#160c12;--s1:#6e1a2e;--s2:#35204f;--s3:#4e3a10;--cb:#3b2463;--cb2:#1f1238}
[data-gt=notte]{--bg:#060818;--s1:#1b2a8f;--s2:#6a1f9a;--s3:#0a6a80;--panel:rgba(12,16,46,.78);--line:rgba(80,230,255,.32);--fg:#e6ecff;--muted:#8d9ad8;--accent:#5cf0ff;--accent-fg:#021a20;--gold1:#d6fbff;--gold2:#3ccde8;--gold3:#0d4a60;--cardbg:#141c40;--cardedge:#5cf0ff;--ink:#e6ecff;--red:#ff5c93;--blk:#a9bcff;--faceA:#202c6a;--faceB:#3a2272;--cb:#2a3cc0;--cb2:#121a60}
[data-gt=carta]{--bg:#efe8d6;--s1:#f3c7a2;--s2:#c0e2d4;--s3:#f1df9c;--panel:rgba(255,251,240,.88);--line:#b9a77a;--fg:#21180e;--muted:#6b5f48;--accent:#9e2b25;--accent-fg:#fff;--gold1:#fff1c7;--gold2:#c79a32;--gold3:#6e4a0c;--cardbg:#fff;--cb:#9e2b25;--cb2:#651a16;color-scheme:light}
.fc{--c4d:#2a6cf0;--c4c:#1f9a45}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:700 16px/1.3 var(--f-b);overflow-x:hidden;touch-action:manipulation}
body::before{content:"";position:fixed;left:-50vmax;top:-50vmax;width:200vmax;height:200vmax;z-index:-2;pointer-events:none;background:radial-gradient(circle at 36% 36%,var(--s1),transparent 36%),radial-gradient(circle at 64% 62%,var(--s2),transparent 38%),radial-gradient(circle at 50% 50%,var(--s3),transparent 62%);animation:spin 80s linear infinite}
body::after{content:"";position:fixed;inset:0;z-index:60;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 50%,rgba(0,0,0,.55)),repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 1px,transparent 1px 3px)}
[data-gt=carta] body::after{opacity:.3}
@keyframes spin{to{transform:rotate(360deg)}}
.embers{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}.embers i{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px 2px var(--accent);opacity:0;animation:ember linear infinite}
@keyframes ember{0%{transform:translate(0,0);opacity:0}10%{opacity:.8}100%{transform:translate(40px,-105vh);opacity:0}}
.wrap{max-width:620px;margin:0 auto;padding:6px 14px 0;display:flex;flex-direction:column;gap:7px;min-height:100svh}
button,select,input{font:inherit;color:inherit}
.hud{display:flex;align-items:center;gap:8px}.grow{flex:1}
.logo{font:900 20px var(--f-t);letter-spacing:.06em;background:linear-gradient(180deg,var(--gold1),var(--gold2) 55%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.6))}
.ib{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold2);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.18),var(--panel));cursor:pointer;font-size:18px;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.4);color:var(--accent)}.ib.off{opacity:.45}
.b{--c:#4d5a66;--cd:#27303a;font:900 17px var(--f-d);letter-spacing:.06em;text-transform:uppercase;border:2px solid rgba(0,0,0,.55);border-radius:14px;padding:12px 18px;min-height:48px;color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 55%),var(--c);box-shadow:0 5px 0 var(--cd),0 9px 16px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35);cursor:pointer;transition:transform .08s,box-shadow .08s,filter .2s;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.b:active:not([disabled]){transform:translateY(4px);box-shadow:0 1px 0 var(--cd),inset 0 1px 0 rgba(255,255,255,.35)}.b[disabled]{filter:grayscale(.85) brightness(.65);cursor:not-allowed}
.b.play{--c:#d8402f;--cd:#7f1b12}.b.disc{--c:#2c7fd6;--cd:#123f7a}.b.yld{--c:#7d55c7;--cd:#40287a}.b.gold{--c:#e2b13c;--cd:#86600c;color:#2a1d03;text-shadow:0 1px 0 rgba(255,255,255,.4)}.b.grn{--c:#2fa65b;--cd:#145f30}.b.sm{font-size:14px;padding:8px 13px;min-height:40px}
.b.play:not([disabled]){animation:ready 1.6s ease-in-out infinite}@keyframes ready{50%{box-shadow:0 5px 0 var(--cd),0 0 22px rgba(255,120,60,.7),inset 0 1px 0 rgba(255,255,255,.35)}}
.b:focus-visible,.card:focus-visible,.ib:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}
.col{display:flex;flex-direction:column;gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text]{background:rgba(0,0,0,.3);border:2px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px;width:100%;min-width:0;font-weight:800}
[data-gt=carta] input[type=text]{background:#fff}
select.sel{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px;min-height:44px}select option{color:#111}
.muted{color:var(--muted);font-weight:600;font-size:14px}.err{color:var(--bad);min-height:1.1em;text-align:center;font-weight:800;font-size:14px}
h3{font:900 16px var(--f-d);letter-spacing:.12em;margin:0;color:var(--accent);text-transform:uppercase}
/* ---- carte ---- */
.card{--cw:64px;width:var(--cw);aspect-ratio:5/7;flex:none;position:relative;background:radial-gradient(120% 90% at 30% 15%,rgba(255,255,255,.7),transparent 60%),radial-gradient(circle at 80% 90%,rgba(160,120,60,.14),transparent 60%),var(--cardbg);border:2px solid var(--cardedge);border-radius:calc(var(--cw)*.1);color:var(--ink);box-shadow:inset 0 0 0 calc(var(--cw)*.035) var(--cardbg),inset 0 0 0 calc(var(--cw)*.05) rgba(185,140,50,.55),0 4px 0 rgba(0,0,0,.35),0 8px 14px rgba(0,0,0,.4);font-family:var(--f-d);user-select:none;-webkit-tap-highlight-color:transparent}
.card.sm{--cw:40px;border-width:1.5px}.card.xl{--cw:clamp(100px,29vw,134px)}
.card.H,.card.D{--su:var(--red)}.card.C,.card.S{--su:var(--blk)}.fc .card.D{--su:var(--c4d)}.fc .card.C{--su:var(--c4c)}
.card .ix{position:absolute;left:7%;top:3%;display:flex;flex-direction:column;align-items:center;line-height:.92;color:var(--su);font-weight:900;font-size:calc(var(--cw)*.25)}
.card .ix i{font-style:normal;font-size:.82em}.card .ix.r{left:auto;top:auto;right:7%;bottom:3%;transform:rotate(180deg)}
.card .pips{position:absolute;inset:17% 29%;color:var(--su)}.card .pips b{position:absolute;transform:translate(-50%,-50%);font-size:calc(var(--cw)*.25);line-height:1;text-shadow:0 1px 0 rgba(255,255,255,.5)}.card .pips b.f{transform:translate(-50%,-50%) rotate(180deg)}
.card .art{position:absolute;inset:15% 19%;border:2px solid var(--su);border-radius:calc(var(--cw)*.06);background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.5),transparent 60%),linear-gradient(160deg,var(--faceA),var(--faceB));display:grid;place-items:center;color:var(--su);overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.card .art svg{width:66%;height:auto;fill:currentColor;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}.card .art em{position:absolute;bottom:1%;font-style:normal;font-size:calc(var(--cw)*.2)}
.card .val{position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);background:var(--su);color:var(--cardbg);font:900 calc(var(--cw)*.16)/1 var(--f-d);padding:2px 7px;border-radius:9px 9px 0 0;white-space:nowrap}
.card .dv{position:absolute;right:-7px;top:-9px;background:linear-gradient(180deg,#ff8a6a,#c92a1e);color:#fff;border:2px solid #000;font:900 13px/1 var(--f-d);padding:4px 6px;border-radius:9px;z-index:3;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.card.back{background:radial-gradient(circle at 50% 50%,rgba(233,196,106,.35) 0 18%,transparent 19%),repeating-linear-gradient(45deg,var(--cb) 0 5px,var(--cb2) 5px 10px);border:3px solid var(--gold2);box-shadow:inset 0 0 0 2px rgba(0,0,0,.4),0 3px 0 rgba(0,0,0,.4)}
.card.foil::after,.holo::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 28%,rgba(255,255,255,.6) 44%,rgba(120,220,255,.35) 50%,rgba(255,120,220,.3) 56%,transparent 70%);background-size:260% 100%;animation:sheen 3.4s linear infinite;mix-blend-mode:overlay;pointer-events:none}
@keyframes sheen{from{background-position:130% 0}to{background-position:-130% 0}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(.8deg)}}.fl8{animation:float 3.6s ease-in-out infinite;animation-delay:var(--fd,0s)}
@keyframes pop{0%{transform:scale(1.6) rotate(-14deg);opacity:0}70%{transform:scale(.94)}100%{transform:rotate(var(--r,0deg));opacity:1}}.pop{animation:pop .45s cubic-bezier(.2,1,.4,1) both}
/* ---- arena e boss ---- */
.acttag{text-align:center;font:800 12px var(--f-d);letter-spacing:.22em;text-transform:uppercase;color:var(--accent);opacity:.9}
.arena3{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:6px}
.side{display:flex;flex-direction:column;align-items:center;gap:10px}
.pile{position:relative;text-align:center;font:800 11px var(--f-d);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.pile .stk{position:relative;width:42px;height:59px;margin:0 auto 3px}.pile .stk .card{--cw:42px;position:absolute;left:0;top:0;border-width:2px}.pile .stk .card:nth-child(2){transform:translate(-3px,-3px)}.pile .stk .card:nth-child(3){transform:translate(-6px,-6px)}
.pile b{position:absolute;right:-8px;top:-10px;min-width:24px;height:24px;border-radius:12px;background:radial-gradient(circle at 35% 30%,var(--gold1),var(--gold2) 60%,var(--gold3));color:#2a1d03;font:900 13px/20px var(--f-d);border:2px solid #000;z-index:4;padding:0 4px}
.pile.empty .stk{border:2px dashed var(--line);border-radius:6px}
.boss{position:relative;justify-self:center;--glow:rgba(233,196,106,.55)}
.boss.H{--glow:rgba(255,70,80,.6)}.boss.D{--glow:rgba(255,190,60,.6)}.boss.C{--glow:rgba(80,220,120,.5)}.boss.S{--glow:rgba(130,140,255,.6)}
.boss::before{content:"";position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 66%);animation:breathe 3.2s ease-in-out infinite;z-index:-1}
@keyframes breathe{50%{transform:scale(1.12);opacity:.7}}
.boss .frame{padding:5px;border-radius:16px;background:linear-gradient(145deg,var(--gold1),var(--gold2) 40%,var(--gold3) 70%,var(--gold2));box-shadow:0 0 0 2px #000,0 10px 24px rgba(0,0,0,.6)}
.boss .frame .card{border-radius:12px;box-shadow:inset 0 0 0 3px var(--cardbg),inset 0 0 0 4px rgba(185,140,50,.6)}
.gem{position:absolute;width:48px;height:48px;display:flex;align-items:center;justify-content:center;font:900 21px var(--f-d);color:#fff;text-shadow:0 2px 0 #000,0 0 4px #000;border:3px solid #1a1206;box-shadow:0 3px 0 rgba(0,0,0,.5),inset 0 -4px 0 rgba(0,0,0,.25);z-index:3}
.gem.atk{left:-16px;bottom:-12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1b0,#e3a628 50%,#7a4a00)}
.gem.hp{right:-16px;bottom:-12px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(circle at 35% 30%,#ffb0a0,#d3261c 50%,#5a0a05)}
.gem.sh{left:-16px;top:34px;width:38px;height:38px;font-size:15px;border-radius:10px 10px 50% 50%;background:radial-gradient(circle at 35% 30%,#bde0ff,#2f7fd6 55%,#0b2e5e)}
.gem{flex-direction:column;line-height:1}.gem small{font:900 7px var(--f-d);letter-spacing:.08em;opacity:.9;margin-top:1px}
.gem.bump{animation:bump .5s}@keyframes bump{30%{transform:scale(1.45)}}
.imm{position:absolute;top:-11px;left:50%;transform:translateX(-50%);white-space:nowrap;background:linear-gradient(180deg,#8d5ad8,#4f2a8c);border:2px solid #000;color:#fff;font:900 11px var(--f-d);letter-spacing:.08em;padding:3px 9px;border-radius:8px;z-index:3;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.imm.off{background:linear-gradient(180deg,#888,#555);text-decoration:line-through}
.nameplate{margin:12px auto 0;text-align:center;position:relative;max-width:300px}
.nameplate .rib{display:inline-block;font:900 17px/1.1 var(--f-d);padding:5px 22px;color:#2a1d03;background:linear-gradient(180deg,var(--gold1),var(--gold2));border:2px solid #000;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%);text-shadow:0 1px 0 rgba(255,255,255,.4)}
.nameplate em{display:block;font:700 13px var(--f-d);color:var(--muted);font-style:italic;margin-top:2px}
.hpbar{height:7px;border-radius:4px;background:rgba(0,0,0,.5);overflow:hidden;margin:5px auto 0;max-width:220px;border:1px solid #000}.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff8a6a,#d3261c);transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.battle{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;align-items:center;min-height:56px;padding:6px;border-radius:14px;background:linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,.12));border:1px solid var(--line)}
.battle .card{transform:rotate(var(--r,0deg))}
.players{display:flex;gap:6px;flex-wrap:wrap}
.pl{flex:1 1 90px;min-width:0;display:flex;align-items:center;gap:7px;border:2px solid var(--line);border-radius:30px;padding:4px 10px 4px 4px;background:var(--panel)}
.pl .av{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold1),var(--gold2) 60%,var(--gold3));color:#2a1d03;display:grid;place-items:center;font:900 15px var(--f-d);flex:none;border:2px solid #000}
.pl span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:14px}.pl.act{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 0 18px var(--accent)}.pl .hc{font:900 14px var(--f-d);color:var(--muted)}
.bubble{position:relative;text-align:center;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:16px}
.bubble .nar{display:block;font:italic 600 13px/1.3 var(--f-d);color:var(--muted);margin-bottom:2px}
.bubble.atk{background:linear-gradient(180deg,rgba(200,40,30,.92),rgba(120,15,10,.92));border-color:#000;color:#fff}.bubble.atk .nar{color:#ffd6cc}.bubble.me{border-color:var(--accent)}.bubble small{display:block;font-weight:600;opacity:.88;font-size:13px}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.prev{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;min-height:28px;align-items:center}
.chip{border:2px solid #000;border-radius:10px;padding:3px 8px;font:900 13px var(--f-d);background:#3a3550;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.chip.atk{background:#c93a35}.chip.off{background:#4a5560;text-decoration:line-through}.chip.sh{background:#2f7fd6}.chip.hl{background:#2a8a4a}.chip.w{background:#6b2c2c;font-family:var(--f-b);font-weight:800}
.meter{width:100%;max-width:330px;height:26px;border-radius:10px;border:2px solid #000;background:rgba(0,0,0,.45);overflow:hidden;position:relative}.meter i{position:absolute;inset:0 auto 0 0;background:linear-gradient(180deg,#5aa8ff,#2c7fd6);transition:width .25s}.meter.ok i{background:linear-gradient(180deg,#6fe39a,#2fa65b)}.meter b{position:absolute;inset:0;display:grid;place-items:center;font:900 15px var(--f-d);text-shadow:0 2px 0 #000;color:#fff}
.ctl{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
/* ---- mano ---- */
.handbox{margin-top:auto;position:sticky;bottom:0;z-index:5;padding:0 0 env(safe-area-inset-bottom,0px);background:linear-gradient(180deg,transparent,var(--bg) 45%)}
.hand{--ov:0px;display:flex;justify-content:center;padding:32px 4px 20px;min-height:140px}
.hand .card{--cw:clamp(58px,17.5vw,90px);cursor:pointer}
.slot{position:relative;transform:translateY(var(--ty,0)) rotate(var(--rot,0deg));transition:transform .22s cubic-bezier(.3,1.7,.5,1);transform-origin:50% 120%}.slot+.slot{margin-left:calc(var(--ov)*-1)}
.slot.sel{transform:translateY(-36px) rotate(0) scale(1.1);z-index:6}.slot.sel .card{box-shadow:inset 0 0 0 3px var(--cardbg),0 0 0 3px var(--accent),0 0 24px var(--accent),0 10px 14px rgba(0,0,0,.45)}
.slot:hover{z-index:5}.slot:hover:not(.sel){transform:translateY(calc(var(--ty,0px) - 12px)) rotate(0)}
.hand .card.off{cursor:default;filter:saturate(.85)}
.cover{text-align:center;padding:26px 10px}.cover .nm{font:900 32px var(--f-t);color:var(--accent);margin:6px 0 14px}
/* ---- menu ---- */
.title{text-align:center;padding-top:14px}.title h1{font:900 clamp(40px,13vw,68px)/1 var(--f-t);margin:0;background:linear-gradient(180deg,var(--gold1),var(--gold2) 50%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #000) drop-shadow(0 0 24px rgba(233,196,106,.35))}
.title p{margin:6px 0 0;color:var(--muted);font:italic 700 15px var(--f-d)}
.trio{display:flex;justify-content:center;margin:14px 0 6px;height:150px;align-items:center}.trio .card{--cw:84px}.trio>div:nth-child(1){transform:rotate(-14deg) translateX(16px)}.trio>div:nth-child(3){transform:rotate(14deg) translateX(-16px)}.trio>div:nth-child(2){z-index:2}.trio>div:nth-child(2) .card{--cw:98px}
.big{width:100%;font-size:19px;padding:15px}
.code{font:900 44px var(--f-d);letter-spacing:.28em;color:var(--accent);text-align:center}
/* ---- effetti ---- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}#pfx{position:fixed;inset:0;pointer-events:none;z-index:79}
.fl{position:fixed;transform:translate(-50%,-50%);font:900 34px var(--f-d);color:#fff;white-space:nowrap;text-shadow:3px 3px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;animation:flo 1.5s ease-out forwards}
.fl.red{color:#ff6a57;font-size:52px}.fl.gold{color:var(--gold1)}.fl.grn{color:var(--good)}.fl.blu{color:#7cc0ff}.fl.gry{color:#d8d0ea;font-size:24px}.fl.big{font-size:40px}

 if(!R.on){try{const o=JSON.parse(ST('rg-off')||'null');if(o&&o.mine)R.mine={...o.mine,name:ME.name}}catch(e){}render();return}
 if(R.mode==='p2p'){try{await p2pEnter()}catch(e){ui.err=netErr(e);render()}return}
 try{let code=ST('rg-room');
  if(code){const sn=await R.db.doc('rooms/'+code).get();if(!sn.exists)code=null;else{const d=sn.data();if(d.phase==='play'&&!(d.seats||[]).some(x=>x.dev===ME.dev))code=null}}
  if(!code)code=await createRoom();await joinRoom(code)}catch(e){ui.err=netErr(e);render()}}
async function p2pCreate(){for(let i=0;i<6;i++){const c=newCode();try{R.db=await p2pHost(c,false);ST('rg-role','host');await R.db.doc('rooms/'+c).set({host:ME.dev,t:Date.now(),phase:'lobby',game:null,opts:{},seats:[],s:null,rev:0});return c}catch(e){if(e.code!=='unavailable-id')throw e}}throw new Error('nessun codice libero')}
async function p2pEnter(){let code=ST('rg-room'),role=ST('rg-role');if(code){try{if(role==='host'){R.db=await p2pHost(code,true);if(!(await R.db.doc('rooms/'+code).get()).exists)code=null}else{R.db=await p2pJoin(code);ST('rg-role','guest')}}catch(e){code=null}}
 if(code){const d=(await R.db.doc('rooms/'+code).get()).data();if(d&&d.phase==='play'&&!(d.seats||[]).some(x=>x.dev===ME.dev))code=null}
 if(!code)code=await p2pCreate();await joinRoom(code)}
const netErr=e=>e&&e.code==='broker'?'Il server di incontro non è raggiungibile: controlla la connessione.':e&&(e.code==='peer-unavailable'||e.code==='timeout'||e.code==='close')&&R.mode==='p2p'?'Stanza non trovata: controlla il codice (l’host deve avere la pagina aperta).':e&&e.code==='invalid_argument'?'Non hai il permesso di scrivere in questa pagina: chiedi al proprietario di condividerla come Contributor.':'Errore di rete: '+(e&&(e.message||e.code)||e);
async function createRoom(){for(let i=0;i<6;i++){const c=newCode(),ref=R.db.doc('rooms/'+c);const sn=await ref.get();if(!sn.exists){await ref.set({host:ME.dev,t:Date.now(),phase:'lobby',game:null,opts:{},seats:[],s:null,rev:0});return c}}throw new Error('nessun codice libero')}
async function joinRoom(code){const old=R.code;unsubAll();
 if(old&&old!==code){try{await R.db.doc('rooms/'+old+'/members/'+ME.dev).delete()}catch(e){}}
 R.code=code;R.ref=R.db.doc('rooms/'+code);R.rev=0;R.doc=null;R.members=[];R.chat=[];G=null;fxDone=null;
 const meRef=R.db.doc('rooms/'+code+'/members/'+ME.dev),ex=await meRef.get(),pv=ex.exists?ex.data():null;
 R.mine={name:ME.name,t:pv?pv.t:Date.now(),guests:pv?pv.guests||[]:R.mine.guests||[],votes:pv?pv.votes||{}:{}};await meRef.set(R.mine);ST('rg-room',code);subscribe()}
function subscribe(){
 R.un.push(R.ref.onSnapshot(sn=>{if(!sn.exists){ST('rg-room','');R.code='';unsubAll();enterHub();return}
  const d=sn.data();R.doc=d;const seated=d.phase==='play'&&!!d.s&&(d.seats||[]).some(x=>x.dev===ME.dev),was=ui.screen;
  ui.screen=ui.screen==='name'?'name':seated?'game':'room';
  if(seated){if(d.rev>=R.rev){const ch=d.rev>R.rev;R.rev=d.rev;if(ch){ui.sel=[];ui.tsel=[]}if(was!=='game'){fxDone=null;G=null;ui.shown=-1}pushState(d.s,false);return}}
  else{R.rev=Math.max(R.rev,d.rev||0);if(was==='game'){G=null;ui.anim=false}}
  render()},e=>{ui.err='Connessione persa ('+e.code+')';render()}));
 R.un.push(R.db.collection('rooms/'+R.code+'/members').onSnapshot(q=>{R.members=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.t-b.t||(a.id<b.id?-1:1));if(ui.screen==='room'){render();tvLater()}},()=>{}));
 R.un.push(R.db.collection('rooms/'+R.code+'/chat').onSnapshot(q=>{const n0=R.chat.length;R.chat=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.t-b.t);if(ui.screen==='room'){render();tvLater();const l=$('#chatlog');if(l)l.scrollTop=l.scrollHeight}else if(R.chat.length>n0&&ui.screen==='game')ui.unread=(ui.unread||0)+1},()=>{}))}
async function writeRoom(patch){if(patch.rev!=null)R.rev=patch.rev;R.doc={...R.doc,...patch};await R.ref.set(R.doc)}
async function saveMine(){if(!R.on){ST('rg-off',JSON.stringify({mine:R.mine,game:G&&ui.screen==='game'?{G,seats:R.offSeats}:null}));render();return}
 try{await R.db.doc('rooms/'+R.code+'/members/'+ME.dev).set(R.mine)}catch(e){ui.err=netErr(e)}render()}
function saveOff(s){if(!R.on)ST('rg-off',JSON.stringify({mine:R.mine,game:s?{G:s,seats:R.offSeats}:null}))}
/* ---- avvio, rivincita, ritorno alla stanza ---- */
function defOpts(id){const g=GAMES.find(x=>x.id===id);const o={};if(g&&g.opts)o[g.opts.k]=ui.opts[id]||g.opts.vals[0][0];return o}
async function startGame(id,seats,opts){const S=seats||lobbySeats(),g=GAMES.find(x=>x.id===id);
 if(!g||!g.ok(S.length)){ui.err=g?g.name+' si gioca con '+g.range+' giocatori':'Gioco sconosciuto';return render()}
 if(R.on&&R.doc&&R.doc.phase==='play'&&!seats){ui.err='C’è già una partita in corso in questa stanza';return render()}
 const o=opts||defOpts(id),s=ENG[id].newGame(S.length,S.map(x=>x.name),o);s.g=id;s.gid=rid();ui.err='';
 if(id==='regicide'&&ST('rg-intro')!=='1')ui.story=true;
 if(R.on){try{await writeRoom({phase:'play',game:id,opts:o,seats:S,s,rev:R.rev+1})}catch(e){ui.err=netErr(e);render()}return}
 R.offSeats=S;R.offGame={id,opts:o};ui.screen='game';G=null;fxDone=null;ui.shown=-1;pushState(s,false);saveOff(s)}
function rematch(){const id=G.g,S=seatsNow().slice(),o=R.on?R.doc.opts:(R.offGame||{}).opts;return startGame(id,S,o||{})}
async function toLobby(){ui.confirm=false;ui.cfg=false;ui.story=false;if(R.on){try{await writeRoom({phase:'lobby',s:null,rev:R.rev+1})}catch(e){ui.err=netErr(e)}return render()}
 G=null;ui.screen='room';saveOff(null);render()}
/* ---- coda degli stati e animazioni ---- */
let Q=Promise.resolve();
function pushState(ns,own){Q=Q.then(()=>applyState(ns,own)).catch(e=>{console.warn(e);ui.anim=false;ui.viewEn=null;ui.view=null;G=ns;fxDone=ns.evn;render()})}
function coverCheck(prev,ns){if(multiLocal()&&prev&&prev.cur!==ns.cur)ui.shown=-1}
async function applyState(ns,own){
 const ev=ns.ev||[],prev=G,isNew=!G||G.gid!==ns.gid,fresh=isNew||fxDone===null||ns.evn===fxDone||!ev.length||ui.screen!=='game';
 if(fresh){G=ns;fxDone=ns.evn;if(isNew){seen.h=null;seen.p=new Set();seen.e=null;prevRank=null;ui.shown=-1;ui.sel=[];ui.tsel=[]}else coverCheck(prev,ns);render();if(isNew&&ns.evn===0&&ui.screen==='game')intro(ns);cap=null;return}
 ui.anim=true;render();const F=FX[ns.g];let cx={};
 try{if(F.pre)cx=await F.pre(prev,ns,own)||{};cap=null;G=ns;fxDone=ns.evn;coverCheck(prev,ns);render();await F.run(prev,ns,own,cx)}
 finally{cap=null;ui.viewEn=null;ui.view=null;ui.anim=false;render();turnNote(prev,ns)}}
function turnNote(prev,ns){if(ns.over||!prev||prev.cur===ns.cur||ns.g==='regicide'||ns.phase==='summary')return;
 if(isMine(ns.cur)){if(!multiLocal()&&R.on){say('Tocca a te!',1400);Snd.play('turn')}}else say('Tocca a '+ns.names[ns.cur],1400)}
function intro(ns){if(ns.g==='regicide'){if(!ui.story&&ns.en)splash(ns.en.c,true);return}
 const g=GAMES.find(x=>x.id===ns.g);banner(g.name.toUpperCase(),g.mode(ns.n));Snd.play('turn');setTimeout(()=>Snd.play('deal'),300)}
async function dispatch(a){if(!myTurn())return;const r=ENG[G.g].act(G,a);if(r.err){ui.err=r.err;Snd.play('err');return render()}
 ui.err='';if(['play','discard','meld','add'].includes(a.t))captureSel();ui.sel=[];ui.tsel=[];
 if(!R.on){pushState(r.s,true);saveOff(r.s);return}
 ui.busy=true;pushState(r.s,true);try{await writeRoom({s:r.s,rev:R.rev+1})}catch(e){ui.err='Mossa non inviata: '+netErr(e)}ui.busy=false;render()}
/* ---- comandi ---- */
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const a=t.dataset.a,v=t.dataset.v;
 if(a!=='sel'&&a!=='tsel')Snd.play('ok');
 switch(a){
 case'setname':{const n=($('#myname')?.value||'').trim().slice(0,14);if(!n){ui.err='Scrivi il tuo nome';return render()}ME.name=n;ST('rg-name',n);R.mine.name=n;if(R.on&&R.code){await saveMine();ui.screen=G?'game':'room';return render()}return enterHub()}
 case'rename':ui.cfg=false;ui.screen='name';return render();
 case'addguest':{const n=($('#gname')?.value||'').trim().slice(0,14);if(!n){ui.err='Scrivi il nome dell’ospite';return render()}if(lobbySeats().length>=10){ui.err='Massimo 10 giocatori per tavolo';return render()}R.mine.guests=[...(R.mine.guests||[]),{k:'g'+rid(),name:n}];ui.err='';return saveMine()}
 case'rmguest':R.mine.guests=(R.mine.guests||[]).filter(g=>g.k!==v);delete R.mine.votes[v];return saveMine();
 case'rmmember':if(R.on){try{await R.db.doc('rooms/'+R.code+'/members/'+v).delete()}catch(x){ui.err=netErr(x)}}return render();
 case'vote':{const[g,k]=v.split('|');const vs=R.mine.votes[k]||[];if(vs.includes(g))R.mine.votes[k]=vs.filter(x=>x!==g);else{if(vs.length>=3){ui.err='Ogni giocatore può votare al massimo 3 giochi';Snd.play('err');return render()}R.mine.votes[k]=[...vs,g]}ui.err='';return saveMine()}
 case'start':return startGame(v);
 case'join':{const c=($('#jc')?.value||'').trim().toUpperCase();if(c.length<3){ui.err='Inserisci il codice della stanza';return render()}if(!R.on){ui.err='Le stanze online non sono disponibili in questa visualizzazione';return render()}
  if(R.mode==='p2p'){try{ui.err='';R.db=await p2pJoin(c);ST('rg-role','guest')}catch(x){ui.err=netErr(x);return render()}}
  try{const sn=await R.db.doc('rooms/'+c).get();if(!sn.exists){ui.err='Stanza '+c+' non trovata';return render()}const d=sn.data();if(d.phase==='play'&&!(d.seats||[]).some(x=>x.dev===ME.dev)){ui.err='In quella stanza c’è una partita in corso: riprova quando tornano alla stanza'}
   await joinRoom(c);say('Sei nella stanza '+c)}catch(x){ui.err=netErr(x);render()}return}
 case'retrynet':R.tried=false;R.on=false;R.mode=null;ui.err='';return enterHub();
 case'emo':{const[e,k]=v.split('|');const m=R.mine.emo=R.mine.emo||{};m[k||'m']={e,t:Date.now()};await saveMine();tvLater();return}
 case'ek':ui.ek=v;return render();
 case'chatsend':return chatSend();
 case'tvcat':ui.cat=v;return render();
 case'tvpick':ui.pick=v;return render();
 case'newroom':if(!R.on)return;try{const c=R.mode==='p2p'?await p2pCreate():await createRoom();await joinRoom(c);say('Nuova stanza '+c)}catch(x){ui.err=netErr(x);render()}return;
 case'copy':{const msg='Vieni a giocare alla Taverna! Apri '+location.origin+location.pathname+' , scrivi il tuo nome e inserisci il codice stanza: '+R.code;try{await navigator.clipboard.writeText(msg);say('Invito copiato: incollalo ai tuoi amici')}catch(x){say('Codice: '+R.code)}return}
 case'resume':try{const o=JSON.parse(ST('rg-off'));R.offSeats=o.game.seats;ui.screen='game';G=null;fxDone=null;pushState(o.game.G,false)}catch(x){}return;
 case'rematch':return rematch();
 case'tolobby':return toLobby();
 case'askstop':ui.confirm=true;return render();case'nostop':ui.confirm=false;return render();
 case'reveal':ui.shown=G.cur;Snd.play('deal');return render();
 case'story':ui.story=false;ST('rg-intro','1');render();if(G&&G.en&&ui.screen==='game')splash(G.en.c,true);return;
 case'm-story':ui.story=true;return render();
 case'rules':ui.rules=ui.rules?null:(v||(G&&G.g)||'regicide');return render();
 case'cfg':ui.cfg=!ui.cfg;return render();
 case'mus':Snd.setMus(!Snd.mus);return render();case'sfx':Snd.setSfx(!Snd.sfx);return render();
 case'next':return dispatch({t:'next'});
 }
 if(G&&ui.screen==='game')gameClick(a,v);
});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='cs'){pstyle=e.target.value!=='nap';ST('rg-cards',pstyle?'pia':'nap');render();return}if(id==='th'){theme=e.target.value;ST('rg-theme',theme);applyTheme()}
 if(id==='fc'){fc=e.target.checked;ST('rg-fc',fc?'1':'0');applyTheme()}
 if(id&&id.startsWith('opt-')){ui.opts[id.slice(4)]=e.target.value}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const id=e.target.id;if(id==='myname')$('[data-a=setname]')?.click();if(id==='gname')$('[data-a=addguest]')?.click();if(id==='jc')$('[data-a=join]')?.click();if(id==='cmsg')chatSend()}
 if((e.key==='Enter'||e.key===' ')&&['sel','tsel','meld'].includes(e.target.dataset?.a)){e.preventDefault();e.target.click()}});

const seen={h:null,p:new Set(),e:null};
const hudH=(title)=>`<div class="hud"><div class="logo">${esc(title||'La Taverna')}</div><div class="grow"></div><button class="ib ${Snd.mus?'':'off'}" data-a="mus" aria-label="Musica" title="Musica">♪</button><button class="ib" data-a="cfg" aria-label="Impostazioni">⚙</button></div>`;
const RULES={
 machiavelli:`<p>Si gioca con 2 mazzi francesi + 4 jolly (108 carte). Ognuno riceve 13 carte; vince chi <b>finisce per primo le carte in mano</b>.</p><ul><li><b>Combinazioni</b>: <b>tris o quartetti</b> (stesso valore, semi tutti diversi) e <b>scale</b> (almeno 3 carte consecutive dello stesso seme; l’asso vale 1 o sta dopo il re, ma non si «gira»: K-A-2 non vale).</li><li>Il <b>jolly</b> sostituisce qualsiasi carta.</li><li><b>Turno</b>: puoi calare carte dalla mano e <b>riorganizzare liberamente il tavolo</b> (spezzare, unire, riprendere un jolly sostituendolo con la carta vera...), purché alla fine <b>ogni combinazione sia valida</b>, tutte le carte del tavolo restino in gioco e tu cali <b>almeno una carta</b> dalla tua mano.</li><li>Se non puoi o non vuoi giocare, <b>peschi una carta</b> e il turno passa.</li><li>Se il mazzo è finito e nessuno riesce a calare, vince chi ha meno carte.</li></ul><p><b>Come si fa qui</b>: tocca le carte (mano o tavolo) per selezionarle, poi «Nuova combinazione» o «+ qui» su una combinazione esistente. «Suggerisci» propone la miglior giocata, «Conferma» la gioca.</p>`,
 island:`<p>Siete su un’isola dimenticata: gli animali hanno fame e <b>dovete far mangiare tutti finché ne resta uno solo</b>. Gioco ispirato a <i>Food Chain Island</i> di Scott Almes.</p><ul><li>16 animali di terra (valore 0–15) in griglia 4×4, più <b>squalo</b> e <b>balena</b>.</li><li><b>Turno</b>: muovi un animale di 1 casella (su, giù, sinistra, destra) sopra un altro che vale <b>da 1 a 3 in meno</b>. Lo impila sopra: la pila vale il numero in cima e si muove insieme.</li><li>Quando mangi scatta <b>il potere</b> dell’animale che ha mangiato (obbligatorio, se puoi). Poi fai un altro turno, con lo stesso animale o con un altro.</li><li>Alcuni poteri valgono <b>al turno dopo</b> (volpe, lince, tigre, leone, procione, orso polare).</li><li>Una volta per partita puoi scartare lo <b>squalo</b> (mangia un animale di valore qualsiasi minore, spostandosi di 1) o la <b>balena</b> (sposta un animale in una casella vuota). Prevalgono sugli altri poteri.</li><li>Si finisce quando non puoi più mangiare (o premi «Concludi»): 1 animale rimasto = grande vittoria, 2 = bella vittoria, 3 = di misura, 4 o più = sconfitta.</li><li>Difficoltà: togli lo squalo, la balena o entrambi.</li></ul><p class="muted">Nota: le caselle vuote si possono usare anche fuori dalla griglia iniziale, in un’area 6×6.</p>`,
 azul:`<p>Siete maestri decoratori al Palazzo Reale di Evora: completate il muro di <b>azulejos</b>.</p><ul><li><b>Turno</b>: prendi <b>tutte</b> le piastrelle di un colore da una fabbrica (le altre vanno al centro) oppure dal centro. Il primo che pesca dal centro prende il segnalino «1» (pavimento, −1 e sarà primo del round dopo).</li><li>Mettile in una <b>riga modello</b> (1–5 posti): un solo colore per riga, e non un colore già presente nella stessa riga del muro. Quelle che non entrano cadono sul <b>pavimento</b> (−1,−1,−2,−2,−2,−3,−3).</li><li>Quando fabbriche e centro sono vuoti: ogni riga piena posa <b>una</b> piastrella sul muro (le altre vanno nel coperchio) e fa punti: 1 se isolata, altrimenti le piastrelle collegate in riga + colonna.</li><li>Fine: appena un muro ha una riga completa. Bonus: riga +2, colonna +7, 5 piastrelle dello stesso colore +10.</li><li><b>Muro libero</b> (variante ufficiale): niente colori stampati, scegli tu la colonna senza ripetere un colore in riga o colonna.</li></ul>`,
  regicide:`<p>Gioco cooperativo (1–4): sconfiggete i 12 nemici del castello (4 Fanti, 4 Regine, 4 Re). Se un giocatore non può subire il danno, perdete tutti.</p><ul><li><b>Turno</b>: gioca una carta (o un Asso + una carta, o carte uguali con somma ≤ 10, o il Jolly) oppure cedi; poi poteri dei semi, danno, e se il nemico sopravvive scarta carte per almeno il suo attacco.</li><li>♥ rimetti in fondo alla Taverna carte dagli scarti. ♦ pesca (senza superare la mano massima). ♣ danno doppio. ♠ l’attacco del nemico cala.</li><li><b>Solo i ♦ fanno pescare.</b></li><li><b>Immunità</b>: il nemico ignora il potere del proprio seme; il Jolly la annulla. Danno esatto: il nemico è redento e va in cima alla Taverna.</li><li>Asso = Animale (1). Fante 10, Regina 15, Re 20. Chi sconfigge un nemico gioca ancora.</li><li>Non si può cedere se tutti gli altri hanno ceduto. Il Jolly (3–4 giocatori): chi lo gioca sceglie chi va dopo.</li><li><b>Solitario</b>: mano da 8, due Jolly per rifare la mano. Oro = 0 usati, Argento = 1, Bronzo = 2.</li></ul>`,
 briscola:`<ul><li>40 carte napoletane, 3 carte a testa. L’ultima carta del mazzo, scoperta, indica la <b>briscola</b> (il seme che vince).</li><li>A turno ognuno gioca una carta. Prende chi gioca la briscola più alta; se non ci sono briscole, la carta più alta del seme giocato per primo.</li><li>Ordine: Asso, 3, Re, Cavallo, Fante, 7, 6, 5, 4, 2.</li><li>Punti: Asso 11, 3 10, Re 4, Cavallo 3, Fante 2. Totale 120: vince chi supera 60.</li><li>Chi prende pesca per primo. In 4 si gioca a coppie (compagni uno di fronte all’altro); in 3 si toglie il 2 di Coppe.</li></ul>`,
 scopa:`<ul><li>40 carte napoletane: 3 a testa e 4 scoperte in tavola.</li><li>Con una carta prendi una carta di pari valore, oppure più carte la cui somma è uguale. Se c’è una carta uguale devi prendere quella. <b>La presa è obbligatoria.</b></li><li>Valori: Asso 1 … 7, Fante 8, Cavallo 9, Re 10.</li><li>Se svuoti il tavolo fai <b>scopa</b> (1 punto), tranne all’ultima giocata.</li><li>A fine mano le carte rimaste vanno a chi ha preso per ultimo. Punti: carte (più carte), denari (più denari), settebello, primiera, scope.</li><li>Primiera: 7=21, 6=18, Asso=16, 5=15, 4=14, 3=13, 2=12, figure=10 (la carta migliore per seme).</li><li>In 4 si gioca a coppie. Si gioca a 11 o 21 punti.</li></ul>`,
 gang:`<p>Siete una banda di scassinatori: vincete aprendo <b>3 caveau</b>, perdete con <b>3 allarmi</b>.</p><ul><li>Ognuno riceve 2 carte coperte (poker Texas Hold’em). Sul tavolo escono 3 carte (Flop), poi 1 (Turn), poi 1 (River).</li><li>A ogni round ci sono gettoni da 1 a N stelle (bianchi, gialli, arancio, rossi). <b>Più stelle = pensi di avere la mano più forte.</b></li><li>A turno: prendi un gettone dal centro, <b>rubalo</b> a un altro giocatore, oppure passa. Il round finisce quando tutti hanno un gettone e tutti passano di fila. (Nel gioco da tavolo si fa tutti insieme: qui si va a turno per giocare anche passandosi il telefono.)</li><li><b>Vietato parlare delle proprie carte!</b> L’unico segnale sono i gettoni.</li><li>Showdown: si rivelano le mani in ordine di gettone rosso. Se ognuna è uguale o più forte della precedente, il caveau si apre.</li><li><b>Avanzata</b>: dopo un colpo riuscito arriva una carta Sfida, dopo un fallimento uno Specialista che aiuta. <b>Professionista</b>: una Sfida resta sempre attiva. <b>Maestro</b>: due Sfide sempre attive, nessuno Specialista e bastano 2 allarmi per perdere.</li></ul><p>Tocca «Guida alle mani» durante la partita per vedere tutte le combinazioni.</p>`,
 saboteur:`<p>Siete nani in miniera. Alcuni sono <b>sabotatori</b> segreti! I cercatori vogliono collegare l’ingresso alla carta d’oro, i sabotatori vogliono impedirlo.</p><ul><li>Ruoli segreti: 3–4 giocatori 1 sabotatore, 5–6 due, 7–9 tre, 10 quattro (un ruolo resta sempre fuori, quindi può anche non esserci nessun sabotatore).</li><li>Turno: gioca <b>una</b> carta (galleria, azione) oppure scartane una coperta; poi peschi.</li><li><b>Gallerie</b>: devono combaciare con tutte le carte vicine e collegarsi all’ingresso. Puoi ruotarle di 180°.</li><li><b>Attrezzi rotti</b> (piccone, lanterna, carrello): chi ne ha uno davanti non può scavare finché non viene riparato.</li><li><b>Frana</b>: togli una galleria. <b>Mappa</b>: guarda in segreto una delle 3 mete.</li><li>Le 3 mete in fondo: una è l’oro, due sono carbone. Quando una galleria le raggiunge si girano.</li><li>Oro trovato: chi l’ha raggiunto pesca tante pepite quanti sono i giocatori, ne sceglie una e passa le altre ai cercatori (in senso antiorario). Oro non trovato a fine mazzo: vincono i sabotatori (4 pepite se è uno solo, 3 se sono 2–3, 2 se sono 4).</li><li>Si giocano 3 round: vince chi ha più pepite.</li></ul><p><b>Saboteur 2</b>: squadre di cercatori blu e verdi (le porte del colore avversario bloccano), Capo, Profittatore, Geologi (contano i cristalli), scale collegate alla superficie, ponti, e nuove azioni: prigione, libertà, furto, giù le mani, cambio cappello, ispezione, scambio delle mani. Pepite: 1 vincitore 5, 2 vincitori 4, 3 vincitori 3, 4 vincitori 2, di più 1 (Capo −1, Profittatore −2). Le forme delle 30 nuove gallerie sono ricostruite.</p>`,
 burraco:`<ul><li>2 mazzi francesi + 4 jolly. 11 carte a testa e due pozzetti da 11. In 4 si gioca a coppie.</li><li>Turno: <b>pesca</b> una carta dal mazzo oppure <b>raccogli tutti gli scarti</b>; poi cala o attacca combinazioni; infine <b>scarta</b> una carta.</li><li>Combinazioni: scala (3+ carte consecutive dello stesso seme, Asso basso o alto) o tris (3+ carte dello stesso valore). Massimo un jolly o una pinella (il 2) per combinazione.</li><li><b>Burraco</b> = combinazione di 7+ carte: pulito (senza jolly) +200, sporco +100.</li><li>Quando finisci le carte prendi il <b>pozzetto</b> (al volo se finisci calando). Una sola volta per coppia.</li><li><b>Chiusura</b> (+100): serve aver preso il pozzetto e avere almeno un burraco; chiudi scartando l’ultima carta (non un jolly o una pinella).</li><li>Punti carte: Jolly 30, pinella 20, Asso 15, dall’8 al Re 10, dal 3 al 7 5. Le carte in mano si sottraggono; pozzetto non preso −100. Se il mazzo finisce, la mano termina.</li></ul>`};

function tvShelf(list,top,N,myKeys,busy){

 const pick=list.find(x=>x.g.id===ui.pick)||top||list[0];
 const order=['carte','tavolo','coop','solo'].filter(k=>list.some(x=>tvInfo(x.g)[0]===k));

 let rows='';
 order.forEach(k=>{const items=vis.filter(x=>tvInfo(x.g)[0]===k);
  for(let i=0;i<items.length;i+=6){const ch=items.slice(i,i+6);
   rows+=`<div class="tvrow">${i===0?`<div class="tvplate">${TVC[k].n}<small>${items.length}</small></div>`:''}<div class="tvboxes">${ch.map(({g,ok,v},j)=>{const c=TVC[k],on=pick&&pick.g===g,h=112+((i+j)*7%5)*4;

  <div class="row">${g.opts&&ok?`<select class="sel sm" id="opt-${g.id}" aria-label="${g.opts.label}">${g.opts.vals.map(([k,l])=>`<option value="${k}" ${(ui.opts[g.id]||g.opts.vals[0][0])===k?'selected':''}>${l}</option>`).join('')}</select>`:''}<button class="b sm ${ok?'play':''}" data-a="start" data-v="${g.id}" ${ok&&!busy?'':'disabled'}>Gioca</button><button class="b sm" data-a="rules" data-v="${g.id}">Regole</button></div></div>`:'';
 return`<div class="tvshelf"><div class="tvsh"><div class="tvst2">LO SCAFFALE</div><div class="tvsn">${vis.length} ${vis.length===1?'gioco':'giochi'} · ${N} giocator${N===1?'e':'i'}</div></div>

/* ================= RETE PEER-TO-PEER (PeerJS + WebRTC) =================
   Il creatore della stanza è l'host: tiene lo stato e lo rilancia a tutti. Gli altri entrano col codice a 4 lettere.
   Espone la stessa interfaccia minima del db (doc/collection: get, set, delete, onSnapshot), così il resto dell'app non cambia. */
const P2P={peer:null,conns:new Map(),store:new Map(),subs:[],role:null,code:'',pend:new Map(),oid:0,hostConn:null,lost:false,retry:null,state:'off'};

const p2pClone=o=>o===undefined?undefined:JSON.parse(JSON.stringify(o));
function p2pSnap(p){const d=P2P.store.get(p);return{id:p.split('/').pop(),exists:d!==undefined,data:()=>p2pClone(d),metadata:{}}}
function p2pNotify(){P2P.subs.slice().forEach(s=>{try{s.check()}catch(e){}})}
function p2pApply(path,data){if(data===null||data===undefined)P2P.store.delete(path);else P2P.store.set(path,data);p2pNotify();if(P2P.role==='host')p2pSave()}
let p2pSaveT=0;function p2pSave(){clearTimeout(p2pSaveT);p2pSaveT=setTimeout(()=>{try{ST('rg-p2p-store',JSON.stringify({code:P2P.code,e:[...P2P.store]}))}catch(e){}},300)}
function p2pSend(c,m){try{if(c.open)c.send(m)}catch(e){}}
function p2pBroadcast(m){P2P.conns.forEach(c=>p2pSend(c,m))}
const p2pDB={
 doc(p){return{path:p,id:p.split('/').pop(),async get(){return p2pSnap(p)},
  async set(d){return p2pWrite(p,p2pClone(d))},async delete(){return p2pWrite(p,null)},
  onSnapshot(n,er){let last;const s={check(){const sn=p2pSnap(p),j=JSON.stringify(sn.data());if(j===last)return;last=j;n(sn)}};P2P.subs.push(s);setTimeout(()=>s.check(),0);return()=>{const i=P2P.subs.indexOf(s);if(i>=0)P2P.subs.splice(i,1)}}}},
 collection(p){return{doc:id=>p2pDB.doc(p+'/'+id),onSnapshot(n){let last;const s={check(){const ks=[...P2P.store.keys()].filter(k=>p2pParent(k)===p).sort(),ds=ks.map(p2pSnap),j=JSON.stringify(ds.map(d=>[d.id,d.data()]));if(j===last)return;last=j;n({docs:ds})}};P2P.subs.push(s);setTimeout(()=>s.check(),0);return()=>{const i=P2P.subs.indexOf(s);if(i>=0)P2P.subs.splice(i,1)}}}}};
function p2pWrite(path,data){
 if(P2P.role==='host'){p2pApply(path,data);p2pBroadcast({op:'put',path,data});return Promise.resolve()}
 if(!P2P.hostConn||!P2P.hostConn.open)return Promise.reject(Object.assign(new Error('Connessione con l’host persa'),{code:'offline'}));
 const oid=++P2P.oid;return new Promise((res,rej)=>{const t=setTimeout(()=>{P2P.pend.delete(oid);rej(Object.assign(new Error('timeout'),{code:'timeout'}))},9000);P2P.pend.set(oid,{res,rej,t});p2pSend(P2P.hostConn,{op:'set',path,data,oid})})}

const p2pOpen=(opts,id)=>new Promise((res,rej)=>{if(typeof Peer==='undefined')return rej(Object.assign(new Error('PeerJS non disponibile'),{code:'nolib'}));let done=false;const pe=id?new Peer(id,opts):new Peer(opts);
 const to=setTimeout(()=>{if(!done){done=true;try{pe.destroy()}catch(e){}rej(Object.assign(new Error('Server di incontro non raggiungibile'),{code:'broker'}))}},5500);
 pe.on('open',()=>{if(!done){done=true;clearTimeout(to);res(pe)}});pe.on('error',e=>{if(!done){done=true;clearTimeout(to);try{pe.destroy()}catch(x){}rej(Object.assign(new Error(e.type||'errore'),{code:e.type||'err'}))}})});
async function p2pProbe(){if(typeof Peer==='undefined')return false;try{const pe=await p2pOpen(p2pPeerOpts());pe.destroy();return true}catch(e){return false}}
const p2pId=c=>'tvn1-'+c;
async function p2pHost(code,restore){p2pReset();let pe;
 for(let i=0;i<5;i++){try{pe=await p2pOpen(p2pPeerOpts(),p2pId(code));break}catch(e){if(e.code==='unavailable-id'&&i<4){await new Promise(r=>setTimeout(r,2000));continue}throw e}}

  c.on('open',()=>{P2P.conns.set(c.peer+'/'+c.connectionId,c);p2pSend(c,{op:'snap',e:[...P2P.store]})});
  c.on('data',m=>{if(!m)return;if(m.op==='set'&&typeof m.path==='string'&&m.path.startsWith('rooms/')){p2pApply(m.path,m.data);p2pBroadcast({op:'put',path:m.path,data:m.data,oid:m.oid,by:dev})}});
  const gone=()=>{P2P.conns.delete(c.peer+'/'+c.connectionId);if(!dev)return;setTimeout(()=>{if(P2P.peer!==pe)return;const room=P2P.store.get('rooms/'+code);if(room&&room.phase==='lobby'&&![...P2P.conns.values()].some(x=>(x.metadata||{}).dev===dev)){const mp='rooms/'+code+'/members/'+dev;if(P2P.store.has(mp)){p2pApply(mp,null);p2pBroadcast({op:'put',path:mp,data:null})}}},20000)};
  c.on('close',gone);c.on('error',gone)});

 if(restore)setTimeout(()=>{if(P2P.peer!==pe)return;const room=P2P.store.get('rooms/'+code);if(!room||room.phase!=='lobby')return;[...P2P.store.keys()].filter(k=>p2pParent(k)==='rooms/'+code+'/members').forEach(k=>{const dv=k.split('/').pop();if(dv!==ME.dev&&![...P2P.conns.values()].some(x=>(x.metadata||{}).dev===dv)){p2pApply(k,null);p2pBroadcast({op:'put',path:k,data:null})}})},30000);

async function p2pJoin(code){p2pReset();const pe=await p2pOpen(p2pPeerOpts());P2P.peer=pe;P2P.role='guest';P2P.code=code;

function p2pLink(code){return new Promise((res,rej)=>{const pe=P2P.peer;let first=true,t;const c=pe.connect(p2pId(code),{metadata:{dev:ME.dev},reliable:true});

  if(m.op==='snap'){P2P.store=new Map(m.e);P2P.hostConn=c;P2P.state='on';if(P2P.lost){P2P.lost=false;ui.err='';}p2pNotify();if(first){first=false;clearTimeout(t);res()}}
  else if(m.op==='put'){p2pApply(m.path,m.data);if(m.oid&&P2P.pend.has(m.oid)){const p=P2P.pend.get(m.oid);P2P.pend.delete(m.oid);clearTimeout(p.t);p.res()}}});

  P2P.lost=true;ui.err='Connessione con l’host persa… riprovo';render();P2P.pend.forEach(p=>{clearTimeout(p.t);p.rej(Object.assign(new Error('Connessione persa'),{code:'offline'}))});P2P.pend.clear();
  clearTimeout(P2P.retry);P2P.retry=setTimeout(function again(){if(P2P.role!=='guest'||P2P.code!==code||!P2P.lost)return;p2pLink(code).then(()=>{ui.err='';const mp='rooms/'+code+'/members/'+ME.dev;if(!P2P.store.has(mp))p2pWrite(mp,p2pClone(R.mine)).catch(()=>{});render()}).catch(()=>{P2P.retry=setTimeout(again,3000)})},2500)};
 c.on('close',lost);c.on('error',lost)})}

  else if(e.t==='redraw'){flt('#av'+e.p,'nuove carte!','gold');Snd.play('draw')}

  else if(e.t==='spec'){banner(GANG.SPEC[e.id].n.toUpperCase(),'Specialista in azione');Snd.play('turn');await W(700)}
  else if(e.t==='showdown'){await W(200);if(e.ok){Snd.play('vault');banner('CAVEAU APERTO!','Le mani erano in ordine');const c=ctr('.felt');burst(c.x,c.y,['#ffd34d','#fff','#c8a24a'],100,{v:9,sq:true})}else{Snd.play('alarm');banner('ALLARME!','Qualcuno ha sbagliato i conti','red');add(null,'flash',null,null,600);shake(12)}await W(900)}
  else if(e.t==='win'){Snd.play('win');confetti()}else if(e.t==='lose'){Snd.play('lose')}}}};

const SEP={1:[25,0],2:[50,35],4:[25,70],8:[0,35]};
function tileSVG(id,r,o={}){if(o.hidden)return`<svg viewBox="0 0 50 70" class="tile"><rect width="50" height="70" rx="5" fill="#2b1d14"/><rect x="3" y="3" width="44" height="64" rx="4" fill="none" stroke="#c8a24a" stroke-width="2"/><text x="25" y="44" text-anchor="middle" font-size="26" font-weight="900" fill="#c8a24a" font-family="Cinzel,serif">?</text></svg>`;
 const K=SAB.C[id];let g='';const segs=K.segs;
 const line=(d,len=1)=>{const[x,y]=SEP[d];return`<line x1="25" y1="35" x2="${25+(x-25)*len}" y2="${35+(y-35)*len}"/>`};
 segs.forEach((m,si)=>{const ds=[1,2,4,8].filter(d=>m&d);if(K.dead)ds.forEach(d=>{const[x,y]=SEP[d];g+=`<line x1="${x}" y1="${y}" x2="${25+(x-25)*.35}" y2="${35+(y-35)*.35}"/>`});
  else if(K.bridge&&si===1)g+=`<g class="over">${ds.map(d=>line(d)).join('')}</g>`;else{g+=ds.map(d=>line(d)).join('');if(ds.length>1&&!K.bridge)g+='<circle cx="25" cy="35" r="7"/>'}});
 let deco='';if(K.dead)deco+='<circle cx="25" cy="35" r="8" fill="#4a3526" stroke="#1a110b" stroke-width="2"/><circle cx="22" cy="33" r="3" fill="#6b5240"/>';
 if(K.door)deco+=`<rect x="18" y="26" width="14" height="18" rx="3" fill="${K.door==='g'?'#2fa65b':'#2c7fd6'}" stroke="#000" stroke-width="1.5"/><circle cx="29" cy="35" r="1.5" fill="#ffd34d"/>`;
 if(K.cry)for(let i=0;i<K.cry;i++)deco+=`<path d="M${11+i*24} 10l5 6-5 6-5-6z" fill="#c38cff" stroke="#5a2a8a"/>`;
 if(K.ladder&&!K.start)deco+='<g stroke="#8a5a2a" stroke-width="2"><line x1="20" y1="22" x2="20" y2="48"/><line x1="30" y1="22" x2="30" y2="48"/><line x1="20" y1="28" x2="30" y2="28"/><line x1="20" y1="35" x2="30" y2="35"/><line x1="20" y1="42" x2="30" y2="42"/></g>';
 if(K.start)deco+='<circle cx="25" cy="35" r="12" fill="#ffd34d" opacity=".35"/><g stroke="#8a5a2a" stroke-width="2.5"><line x1="19" y1="22" x2="19" y2="48"/><line x1="31" y1="22" x2="31" y2="48"/><line x1="19" y1="28" x2="31" y2="28"/><line x1="19" y1="35" x2="31" y2="35"/><line x1="19" y1="42" x2="31" y2="42"/></g>';
 if(K.goal==='gold')deco+='<g fill="#ffd34d" stroke="#8a5a00" stroke-width="1"><circle cx="20" cy="38" r="6"/><circle cx="31" cy="37" r="7"/><circle cx="25" cy="29" r="6"/></g>';
 if(K.goal==='coal')deco+='<g fill="#555" stroke="#222"><circle cx="21" cy="38" r="6"/><circle cx="30" cy="36" r="5"/><circle cx="26" cy="30" r="4"/></g>';
 return`<svg viewBox="0 0 50 70" class="tile ${K.goal||''}"><rect width="50" height="70" rx="5" fill="url(#rockg)"/><g transform="${r?'rotate(180 25 35)':''}"><g class="tun">${g}</g>${deco}</g></svg>`}
const SAI={break:'💥',fix:'🔧',map:'🗺️',rock:'🪨',trap:'⛓️',free:'🔓',theft:'💰',handsoff:'✋',hats:'🎩',inspect:'🔍',swap:'🔄'},TOOLI={pick:'⛏️',lamp:'🔦',cart:'🛒'};
const SAN={break:'Sabotaggio',fix:'Riparazione',map:'Mappa',rock:'Frana',trap:'Prigione',free:'Libertà',theft:'Furto',handsoff:'Giù le mani',hats:'Cambio cappello',inspect:'Ispezione',swap:'Scambio mani'};
function sabCardH(id,o={}){const K=SAB.C[id];const a=o.attrs||'',st=o.style?`style="${o.style}"`:'';
 if(K.segs)return`<div class="card scard ${o.cls||''}" ${a} ${st}>${tileSVG(id,o.r||0)}</div>`;
 const tools=(K.tools||(K.tool?[K.tool]:[])).map(t=>TOOLI[t]).join('');
 return`<div class="card scard act ${K.a} ${o.cls||''}" ${a} ${st}><div class="sic">${SAI[K.a]}</div><div class="stl">${tools}</div><div class="sname">${SAN[K.a]}</div></div>`}
function sabTargets(s,c){const out=new Set();if(!c)return out;for(let p=0;p<s.n;p++){const K=SAB.C[c];const tools=K.tools||[undefined];if(tools.some(t=>!SAB.act(s,{t:'act',c,to:p,tool:t}).err))out.add(p)}return out}
function sabotH(){const s=G,v=viewer(),cover=needCover(),mine=myTurn()&&s.phase==='play',c=ui.sel[0],K=c&&SAB.C[c];
 const ks=Object.keys(s.board).map(k=>k.split(',').map(Number));const xs=ks.map(k=>k[0]),ys=ks.map(k=>k[1]);
 const x0=Math.min(0,...xs)-1,x1=Math.max(8,...xs)+1,y0=Math.min(-2,...ys)-1,y1=Math.max(2,...ys)+1,cols=x1-x0+1;
 const rotc=ui.srot||0;let hot=new Set();
 if(mine&&c){if(SAB.isPath(c))SAB.placements(s,c).filter(p=>p.r===rotc).forEach(p=>hot.add(p.x+','+p.y));
  else if(K.a==='rock')for(const k in s.board)if(SAB.isPath(s.board[k].id))hot.add(k);
  else if(K.a==='map')[-2,0,2].forEach(y=>{if(s.board['8,'+y]&&s.board['8,'+y].hidden)hot.add('8,'+y)})}
 let cells='';for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const k=x+','+y,b=s.board[k],h=hot.has(k);
  cells+=`<div class="cell ${h?'hot':''} ${b?'full':''}" ${h?`data-a="cell" data-v="${k}" role="button" tabindex="0"`:''} id="cell${x}_${y}">${b?tileSVG(b.id,b.r,{hidden:b.hidden}):h&&SAB.isPath(c)?`<div class="ghost">${tileSVG(c,rotc)}</div>`:''}</div>`}
 const board=`<div class="mine" style="--tw:${ui.szoom?'46px':`min(48px,calc((min(100vw,620px) - 58px) / ${cols}))`}"><svg width="0" height="0" style="position:absolute"><defs><radialGradient id="rockg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#4a3424"/><stop offset="1" stop-color="#22160e"/></radialGradient></defs></svg><div class="grid" style="grid-template-columns:repeat(${x1-x0+1},var(--tw))">${cells}</div></div>`;
 const T=K&&!K.segs&&!['rock','map'].includes(K.a)&&mine?sabTargets(s,c):new Set();
 const pls=`<div class="splayers" id="players">${s.names.map((n,i)=>{const br=SAB.TOOLS.filter(t=>s.broken[i][t]).map(t=>`<span class="brk">${TOOLI[t]}</span>`).join('');
  return`<div class="sp ${i===s.cur&&s.phase!=='summary'?'act':''} ${T.has(i)?'tgt':''}" ${T.has(i)?`data-a="target" data-v="${i}" role="button" tabindex="0"`:''}><div class="av" id="av${i}">${esc(n[0]||'?')}</div><span class="n">${esc(n)}${seatTag(i)}</span>${br}${s.trap[i]?'<span class="brk">⛓️</span>':''}${s.theft[i]?'<span class="brk">💰</span>'.repeat(s.theft[i]):''}<span class="hc">${s.hands[i].length}🂠</span></div>`}).join('')}</div>`;
 const role=v>=0&&s.phase!=='summary'?`<div class="srole ${s.roles[v]}"><span>Il tuo ruolo</span><b>${SAB.RN[s.roles[v]]}</b>${(s.priv[v]||[]).map(t=>`<em>🔒 ${esc(t)}</em>`).join('')}</div>`:'';
 const info=`<div class="tinfo"><span class="chip">Round ${s.round}/3</span><span class="chip">Mazzo ${s.deck.length}</span>${s.exp?'<span class="chip sh">Saboteur 2</span>':''}<button class="chip" data-a="szoom">${ui.szoom?'Vista intera':'Ingrandisci'}</button>${v>=0?`<span class="chip hl">Le tue pepite: ${s.score[v]}</span>`:''}</div>`;
 let hint='',ctl='';
 if(mine){if(!c)hint='<span class="muted">Scegli una carta: galleria, azione o da scartare</span>';
  else if(SAB.isPath(c)){const blocked=Object.values(s.broken[s.cur]).some(Boolean)||s.trap[s.cur];hint=blocked?'<span class="chip w">Hai un attrezzo rotto o sei imprigionato: non puoi scavare</span>':hot.size?'<span class="chip hl">Tocca una casella illuminata per scavare</span>':'<span class="chip w">Nessun posto valido con questo verso: prova a ruotare</span>';
   ctl=`<button class="b sm yld" data-a="srot">Ruota ↻</button>`}
  else if(K.a==='rock')hint='<span class="chip">Tocca una galleria da far crollare</span>';else if(K.a==='map')hint='<span class="chip">Tocca una meta coperta per sbirciare</span>';
  else hint=T.size?'<span class="chip">Tocca il giocatore bersaglio</span>':'<span class="chip w">Nessun bersaglio valido</span>';
  ctl+=`<button class="b disc sm" data-a="spass" ${c||!s.hands[s.cur].length?'':'disabled'}>${s.hands[s.cur].length?'Scarta e passa':'Passa'}</button>`;
  if(ui.sfix)hint=`<span class="chip">Quale attrezzo riparare?</span>${ui.sfix.tools.map(t=>`<button class="b sm grn" data-a="sfixt" data-v="${t}">${TOOLI[t]} ${SAB.TN[t]}</button>`).join('')}`}
 const hand=cover?coverH(s.cur):v>=0?fanH(s.hands[v],(id,o)=>sabCardH(id,{...o,r:SAB.isPath(id)?(ui.srot||0):0}),{mine}):'';
 const sum=(s.phase==='summary'||s.phase==='gold')&&!ui.anim?sabSummary(s):'';
 return`${hudH('Saboteur')}${info}${role}${board}${pls}${bubbleH(s,'Scava verso l’oro, o sabota di nascosto se sei un sabotatore!',null)}<div class="prev">${hint}</div><div class="ctl">${ctl}</div><div class="err" role="alert">${esc(ui.err)}</div><div class="handbox">${hand}</div>${sum}${rulesH()}${cfgH()}`}
function sabSummary(s){const R0=s.res;if(!R0)return'';const isGold=s.phase==='gold';
 const rows=s.names.map((n,i)=>`<tr class="${R0.win.includes(i)?'w':''}"><td>${esc(n)}</td><td><span class="rtag ${R0.roles[i]}">${SAB.RN[R0.roles[i]]}</span></td><td>+${R0.gold[i]}</td><td><b>${s.score[i]+(isGold?0:0)}</b></td></tr>`).join('');
 let body=`<h2>${esc(R0.txt)}</h2><table class="sumt"><tr><th>Giocatore</th><th>Ruolo</th><th>Round</th><th>Totale</th></tr>${rows}</table>${R0.steal?R0.steal.map(([t,v])=>`<p class="muted">💰 ${esc(s.names[t])} ruba 1 pepita a ${esc(s.names[v])}</p>`).join(''):''}`;
 if(isGold){const gp=s.gp,me=myTurn();body+=`<h3>Spartizione dell’oro</h3><p class="muted">${me?'Scegli la tua pepita, le altre passano al prossimo cercatore.':esc(s.names[s.cur])+' sta scegliendo una pepita…'}</p><div class="nuggets">${gp.cards.map((v,i)=>`<button class="nug" data-a="sgold" data-v="${i}" ${me?'':'disabled'}>${'●'.repeat(v)}<b>${v}</b></button>`).join('')}</div>`}
 else if(s.over){const w=s.over.winners||[];body+=`<h3>Fine della partita</h3><p>${w.map(i=>esc(s.names[i])).join(' e ')} ${w.length>1?'vincono':'vince'} con ${s.over.scores[w[0]]} pepite!</p><div class="col"><button class="b play" data-a="rematch">Rivincita</button><button class="b disc" data-a="tolobby">Torna alla stanza</button></div>`}
 else body+=myTurn()?'<button class="b play" data-a="next">Prossimo round</button>':`<p class="muted">${esc(s.names[s.cur])} avvia il prossimo round…</p>`;
 return`<div class="modal"><div class="box ssum">${body}</div></div>`}
function sabClick(a,v){const s=G;if(a==='srot'){ui.srot=ui.srot?0:1;return render()}if(a==='szoom'){ui.szoom=!ui.szoom;return render()}
 if(!myTurn())return;
 if(a==='sgold')return dispatch({t:'gold',i:+v});
 if(a==='sel'){if(s.phase!=='play')return;ui.sel=ui.sel[0]===v?[]:[v];ui.sfix=null;ui.err='';Snd.play('sel');return render()}
 const c=ui.sel[0];if(!c)return;const K=SAB.C[c];
 if(a==='cell'){const[x,y]=v.split(',').map(Number);if(SAB.isPath(c))return dispatch({t:'path',c,x,y,r:ui.srot||0});if(K.a==='rock')return dispatch({t:'rock',c,x,y});if(K.a==='map')return dispatch({t:'map',c,y})}
 if(a==='target'){const p=+v;if(K.a==='fix'&&K.tools.length>1){const br=K.tools.filter(t=>s.broken[p][t]);if(br.length>1){ui.sfix={to:p,tools:br};return render()}}return dispatch({t:'act',c,to:p})}
 if(a==='sfixt'&&ui.sfix){const f=ui.sfix;ui.sfix=null;return dispatch({t:'act',c,to:f.to,tool:v})}
 if(a==='spass')return dispatch({t:'pass',c})}
const SBFX={async pre(prev,ns,own){const e=ns.ev[0];if(e&&e.t==='path'){Snd.play('whoosh');const it=own&&cap&&cap.length?cap:null;if(it)await flyCards(it,'#cell'+e.x+'_'+e.y,{fade:false,scale:.6},(id)=>sabCardH(id))}return{}},

const AZC=[['#1f5fbf','#0e3a7d','#e8f1ff'],['#f2c230','#b8860b','#fff3c4'],['#c8412f','#7d2218','#ffd9cf'],['#2a2d38','#0f1016','#e5c26a'],['#2fb5b0','#12706c','#d8fffd']];
function azT(c,cls=''){const[bg,dk,lt]=AZC[c];let m='';
 if(c===0)m=`<g fill="${lt}"><circle cx="20" cy="20" r="4"/><circle cx="20" cy="11" r="4.5"/><circle cx="20" cy="29" r="4.5"/><circle cx="11" cy="20" r="4.5"/><circle cx="29" cy="20" r="4.5"/></g><circle cx="20" cy="20" r="2" fill="${dk}"/>`;
 else if(c===1)m=`<circle cx="20" cy="20" r="6.5" fill="${lt}" stroke="${dk}" stroke-width="1.5"/><g stroke="${dk}" stroke-width="2" stroke-linecap="round"><path d="M20 5v6M20 29v6M5 20h6M29 20h6M9.5 9.5l4 4M26.5 26.5l4 4M30.5 9.5l-4 4M13.5 26.5l-4 4"/></g>`;
 else if(c===2)m=`<path d="M20 5L35 20L20 35L5 20Z" fill="none" stroke="${lt}" stroke-width="2.4"/><path d="M20 12L28 20L20 28L12 20Z" fill="${lt}"/><circle cx="20" cy="20" r="2.4" fill="${bg}"/>`;
 else if(c===3)m=`<circle cx="20" cy="20" r="11" fill="none" stroke="${lt}" stroke-width="2.4"/><circle cx="20" cy="20" r="4" fill="${lt}"/><g fill="${lt}"><circle cx="7" cy="7" r="2"/><circle cx="33" cy="7" r="2"/><circle cx="7" cy="33" r="2"/><circle cx="33" cy="33" r="2"/></g>`;
 else m=`<g stroke="${lt}" stroke-width="2" fill="none"><path d="M20 4v32M4 20h32M9 9l22 22M31 9L9 31"/></g><circle cx="20" cy="20" r="5" fill="${bg}" stroke="${lt}" stroke-width="2"/>`;
 return`<svg viewBox="0 0 40 40" class="azt ${cls}"><rect x="1" y="1" width="38" height="38" rx="5" fill="${bg}" stroke="${dk}" stroke-width="2"/><rect x="4" y="4" width="32" height="32" rx="3" fill="none" stroke="${lt}" stroke-opacity=".45" stroke-width="1"/>${m}</svg>`}
const azFirst=`<svg viewBox="0 0 40 40" class="azt"><rect x="1" y="1" width="38" height="38" rx="5" fill="#f5efe0" stroke="#8a7a52" stroke-width="2"/><text x="20" y="27" text-anchor="middle" font-size="22" font-weight="900" fill="#8a2a1a">1</text></svg>`;
function azBoard(s,p,o={}){const b=s.boards[p],act=o.act,sel=ui.azs,tilePh=s.phase==='tile'&&act&&s.cur===p;
 const r0=tilePh?b.lines.findIndex((l,i)=>l.k===i+1):-1,fc=tilePh&&r0>=0?AZUL.freeCols(b,r0,b.lines[r0].c):[];
 let ln='';for(let r=0;r<5;r++){const L=b.lines[r];let cells='';for(let k=0;k<5;k++){if(k<4-r){cells+='<i class="azs sp"></i>';continue}const idx=k-(4-r);const filled=idx>=r+1-L.k;
   cells+=`<i class="azs ${filled?'f':''}">${filled?azT(L.c):''}</i>`}
  const hot=act&&s.phase==='pick'&&sel&&AZUL.canLine(s,b,r,sel.color);
  ln+=`<div class="azl ${hot?'hot':''}" id="azl${p}_${r}" ${hot?`data-a="azline" data-v="${r}" role="button" tabindex="0"`:''}>${cells}</div>`}
 let wl='';for(let r=0;r<5;r++){let cells='';for(let c=0;c<5;c++){const v=b.wall[r][c];const hot=tilePh&&r===r0&&fc.includes(c);
   const ghost=!s.grey?AZUL.colOf(s,r,c):-1;
   cells+=`<i class="azw ${v>=0?'f':''} ${hot?'hot':''}" id="azc${p}_${r}_${c}" ${hot?`data-a="azcell" data-v="${c}" role="button" tabindex="0"`:''}>${v>=0?azT(v):ghost>=0?azT(ghost,'gh'):''}</i>`}
  wl+=`<div class="azr">${cells}</div>`}
 const fh=act&&((s.phase==='pick'&&sel)||(tilePh&&!fc.length&&r0>=0));
 let fl='';for(let i=0;i<7;i++){const t=b.floor[i];fl+=`<i class="azf">${t==null?'':t==='F'?azFirst:azT(t)}<em>${AZUL.FLOOR[i]}</em></i>`}
 return`<div class="azb ${o.mini?'mini':''} ${s.cur===p&&!s.over?'cur':''}" id="azb${p}"><div class="azh"><b>${esc(s.names[p])}</b><span class="azsc" id="azsc${p}">${b.score}</span></div><div class="azg"><div class="azls">${ln}</div><div class="azwall ${s.grey?'grey':''}">${wl}</div></div>
 <div class="azfl ${fh?'hot':''}" id="azf${p}" ${fh?`data-a="azfloor" role="button" tabindex="0"`:''}>${fl}</div></div>`}
function azulH(){const s=G,mine=myTurn(),v=viewer();const L=local();if(needCover())return`${hudH('Azul')}${coverH(s.cur)}${rulesH()}${cfgH()}`;
 const me=isMine(s.cur)?s.cur:v>=0?v:(L[0]??0);const sel=ui.azs;

 const hand=cover?coverH(s.cur):v>=0?fanH(s.hands[v],icardH,{mine}):'';
 const sum=s.phase==='summary'&&!s.over&&!ui.anim?summaryScopa(s):'';
 return`${hudH('Scopa')}${score}${playersH(s,{teams:s.n===4})}${table}${piles}${bubbleH(s,'Scegli una carta; se può prendere, scegli cosa prendere dal tavolo.',null)}<div class="prev">${hint}</div><div class="ctl">${ctl}</div><div class="err" role="alert">${esc(ui.err)}</div><div class="handbox">${hand}</div>${sum}${s.over&&s.res&&!ui.anim?'':''}${endH()}${rulesH()}${cfgH()}`}
function summaryScopa(s){const tn=t=>esc(IT.teamName(s,t)),r=s.res;
 return`<div class="modal"><div class="box"><h2>Fine della mano ${s.round}</h2><table class="sumt"><tr><th></th>${s.scores.map((_,t)=>`<th>${tn(t)}</th>`).join('')}</tr>${r.rows.map(x=>`<tr><td>${x.label}</td>${x.vals.map((v,t)=>`<td class="${x.w===t?'w':''}">${v}${x.w===t?' ✓':''}</td>`).join('')}</tr>`).join('')}<tr class="tot"><td>Punti mano</td>${r.pts.map(v=>`<td>+${v}</td>`).join('')}</tr><tr class="tot"><td>Totale</td>${s.scores.map(v=>`<td>${v}</td>`).join('')}</tr></table>
 ${myTurn()?'<button class="b play" data-a="next">Prossima mano</button>':`<p class="muted">${esc(s.names[s.cur])} distribuisce la prossima mano…</p>`}</div></div>`}
function scopaClick(a,v){const s=G;if(!myTurn()||s.phase!=='play')return;
 if(a==='sel'){if(ui.sel[0]===v){const o=IT.SCOPA.options(s.table,v);if(!o.length)return dispatch({t:'play',c:v,take:[]});if(o.length===1)return dispatch({t:'play',c:v,take:o[0]})}
  ui.sel=[v];const o=IT.SCOPA.options(s.table,v);ui.tsel=o.length===1?o[0].slice():[];ui.err='';Snd.play('sel');return render()}
 if(a==='tsel'){if(!ui.sel[0])return;const i=ui.tsel.indexOf(v);i<0?ui.tsel.push(v):ui.tsel.splice(i,1);Snd.play(i<0?'sel':'unsel');return render()}
 if(a==='play'&&ui.sel[0])return dispatch({t:'play',c:ui.sel[0],take:ui.tsel.slice()})}
const SCFX={async pre(prev,ns,own){const pl=ns.ev.find(e=>e.t==='play');if(!pl)return{};Snd.play('whoosh');
  const items=own&&cap&&cap.length?cap:avatarItems(pl.p,pl.c);await flyCards(items,'#table',{fade:false,scale:.95},icardH);
  if(!pl.take.length){Snd.play('deal');return{}}
  pl.take.forEach(c=>{const el=document.querySelector('#table [data-v="'+c+'"]');if(el)el.parentElement.classList.add('taking')});Snd.play('impact');await W(480);
  const taken=pl.take.map(c=>{const el=document.querySelector('#table [data-v="'+c+'"]');return el?{id:c,r:el.getBoundingClientRect()}:null}).filter(Boolean);return{taken,p:pl.p}},
 async run(prev,ns,own,cx){if(cx.taken&&cx.taken.length){Snd.play('whoosh');flyCards(cx.taken,'#av'+cx.p,{scale:.3},icardH)}
  for(const e of ns.ev){if(e.t==='scopa'){await W(250);const c=ctr('#table');banner('SCOPA!',ns.names[e.p]);burst(c.x,c.y,['#fff','#ffd34d','#5be08a'],90,{v:9,sq:true});Snd.play('kill');shake(10);await W(1000)}
   else if(e.t==='deal'){await W(200);say('Nuove carte!',1200);Snd.play('deal')}
   else if(e.t==='sweep'){say('Le carte rimaste vanno a '+IT.teamName(ns,e.w),1800);await W(400)}
   else if(e.t==='round'){Snd.play('redeem');await W(300)}}
  await W(300);endFx(ns)}};
/* ================= BURRACO ================= */
function burracoH(){const s=G,v=viewer(),cover=needCover(),mine=myTurn(),L=local(),my=(v>=0?v:(L[0]??0))%2,op=1-my,tn=t=>esc(IT.teamName(s,t));
 const sortB=cs=>cs.slice().sort((a,b)=>{const p=BURR.P(a),q=BURR.P(b);if(ui.bsort==='rank')return(p.j-q.j)||(p.r-q.r)||(p.s<q.s?-1:p.s>q.s?1:0)||(a<b?-1:1);const so='SHDC';return(p.j-q.j)||(so.indexOf(p.s)-so.indexOf(q.s))||(p.r-q.r)||(a<b?-1:1)});
 const meldsH=(t,click)=>`<div class="melds" id="melds${t}">${s.melds[t].map((m,i)=>{const b=BURR.isBurraco(m);return`<div class="meld ${b?(m.wild?'bs':'bp'):''} ${click&&ui.sel.length?'can':''}" ${click?`data-a="meld" data-v="${i}" tabindex="0" role="button"`:''}>${m.cards.map(c=>bcardH(c,{cls:'sm'})).join('')}${b?`<span class="btag">${m.wild?'Burraco sporco':'Burraco pulito'}</span>`:''}</div>`}).join('')||'<span class="muted">Nessuna combinazione</span>'}</div>`;
 const teamBox=(t,click)=>`<div class="team ${t===my?'mine':''}"><div class="th"><b>${t===my?'Noi':'Loro'}: ${tn(t)}</b><span class="chip ${s.pozzTaken[t]?'hl':''}">${s.pozzTaken[t]?'Pozzetto preso':'Pozzetto da prendere'}</span><span class="chip">${s.scores[t]} pt</span></div>${meldsH(t,click)}</div>`;
 const disc=`<div class="pile" id="bdisc" ${mine&&s.phase==='draw'&&s.disc.length?'data-a="drawdisc" role="button" tabindex="0"':''}><div class="dfan">${s.disc.slice(-7).map(c=>bcardH(c,{cls:'sm',attrs:`data-v="${c}"`})).join('')||'<span class="muted">vuoto</span>'}</div>Scarti${s.disc.length?`<b>${s.disc.length}</b>`:''}</div>`;
 const center=`<div class="felt bur"><div class="deckbox" ${mine&&s.phase==='draw'?'data-a="drawdeck" role="button" tabindex="0"':''}>${deckH(s.deck.length)}</div>${disc}<div class="pile"><div class="stk">${s.pozz.length?cardH('',{back:1}):''}</div>Pozzetti<b>${s.pozz.length}</b></div></div>`;
 let hint='',ctl='';
 if(mine&&s.phase==='draw'){ctl=`<button class="b disc" data-a="drawdeck" ${s.deck.length?'':'disabled'}>Pesca dal mazzo</button><button class="b yld" data-a="drawdisc" ${s.disc.length?'':'disabled'}>Raccogli scarti (${s.disc.length})</button>`}
 else if(mine&&s.phase==='play'){const sel=ui.sel,m=sel.length>=3?BURR.validate(sel):null;
  hint=!sel.length?'<span class="muted">Seleziona carte da calare, poi tocca una tua combinazione per attaccarle, oppure scarta una carta</span>':m?`<span class="chip hl">${m.t==='seq'?'Scala':'Tris'} valid${m.t==='seq'?'a':'o'}${sel.length>=7?' · BURRACO!':''}</span>`:sel.length===1?`<span class="chip">${BURR.fmt(sel[0])}: puoi scartarla o attaccarla a una combinazione</span>`:`<span class="chip">${sel.length} carte selezionate (${sel.length<3?'per calare ne servono 3':'non formano una combinazione'})</span>`;
  ctl=`<button class="b play" data-a="bmeld" ${m?'':'disabled'}>Cala</button><button class="b disc" data-a="bdisc" ${sel.length===1?'':'disabled'}>Scarta</button>`}
 const sortBtn=v>=0?`<button class="b sm" data-a="bsort">Ordina per ${ui.bsort==='suit'?'valore':'seme'}</button>`:'';
 const hand=cover?coverH(s.cur):v>=0?fanH(sortB(s.hands[v]),bcardH,{mine,many:true}):'';
 const sum=s.phase==='summary'&&!s.over&&!ui.anim?summaryBurraco(s):'';
 return`${hudH('Burraco')}<div class="tinfo"><span class="chip">${s.target?'a '+s.target+' punti':'una mano'} · mano ${s.round}</span></div>${playersH(s,{teams:s.n===4})}${teamBox(op,false)}${center}${teamBox(my,mine&&s.phase==='play')}${bubbleH(s,s.phase==='draw'?'Pesca dal mazzo o raccogli tutti gli scarti.':'Cala, attacca e poi scarta una carta per finire il turno.',null)}<div class="prev">${hint}</div><div class="ctl">${ctl}${sortBtn}</div><div class="err" role="alert">${esc(ui.err)}</div><div class="handbox">${hand}</div>${sum}${endH()}${rulesH()}${cfgH()}`}
function summaryBurraco(s){const tn=t=>esc(IT.teamName(s,t)),r=s.res,row=(l,k)=>`<tr><td>${l}</td>${r.map(x=>`<td>${x[k]>0&&k!=='cards'?'+':''}${x[k]}</td>`).join('')}</tr>`;
 return`<div class="modal"><div class="box"><h2>Fine della mano ${s.round}</h2><table class="sumt"><tr><th></th>${r.map((_,t)=>`<th>${tn(t)}</th>`).join('')}</tr>${row('Carte calate','cards')}${row('Burraco','bonus')}${row('Chiusura','close')}${row('Carte in mano','hand')}${row('Pozzetto non preso','pozz')}<tr class="tot"><td>Punti mano</td>${r.map(x=>`<td>${x.tot}</td>`).join('')}</tr><tr class="tot"><td>Totale</td>${s.scores.map(v=>`<td>${v}</td>`).join('')}</tr></table>
 ${myTurn()?'<button class="b play" data-a="next">Prossima mano</button>':`<p class="muted">${esc(s.names[s.cur])} distribuisce la prossima mano…</p>`}</div></div>`}
function burClick(a,v){const s=G;if(a==='bsort'){ui.bsort=ui.bsort==='suit'?'rank':'suit';return render()}
 if(!myTurn())return;
 if(a==='drawdeck')return dispatch({t:'draw',from:'deck'});if(a==='drawdisc')return dispatch({t:'draw',from:'disc'});
 if(a==='sel'){if(s.phase!=='play'){ui.err='Prima pesca dal mazzo o raccogli gli scarti';return render()}const i=ui.sel.indexOf(v);i<0?ui.sel.push(v):ui.sel.splice(i,1);ui.err='';Snd.play(i<0?'sel':'unsel');return render()}
 if(a==='bmeld')return dispatch({t:'meld',cards:ui.sel.slice()});
 if(a==='bdisc'&&ui.sel.length===1)return dispatch({t:'discard',c:ui.sel[0]});
 if(a==='meld'){if(!ui.sel.length){ui.err='Seleziona prima le carte da attaccare';return render()}return dispatch({t:'add',mi:+v,cards:ui.sel.slice()})}}
const BUFX={async pre(prev,ns,own){const e=ns.ev[0];if(!e)return{};
  if(e.t==='discard'){Snd.play('whoosh');const items=own&&cap&&cap.length?cap:avatarItems(e.p,[e.c]);await flyCards(items,'#bdisc',{fade:false,scale:.7},bcardH)}
  else if(e.t==='meld'||e.t==='add'){Snd.play('whoosh');const items=own&&cap&&cap.length?cap:avatarItems(e.p,e.cards);await flyCards(items,'#melds'+(e.p%2),{fade:true,scale:.6},bcardH)}
  else if(e.t==='drawdisc'){const items=[...document.querySelectorAll('#bdisc .card')].map(c=>({id:c.dataset.v,r:c.getBoundingClientRect()}));Snd.play('whoosh');await flyCards(items,isMine(e.p)?'#hand':'#av'+e.p,{scale:.6},bcardH)}
  return{}},
 async run(prev,ns){for(const e of ns.ev){
  if(e.t==='drawdeck'){if(!isMine(e.p))flt('#av'+e.p,'+1','gry');Snd.play('deal')}
  else if(e.t==='drawdisc'){flt('#av'+e.p,'+'+e.n,'gold')}
  else if(e.t==='meld'||e.t==='add'){if(e.bur){const c=ctr('#melds'+(e.p%2));banner('BURRACO!',ns.names[e.p]);burst(c.x,c.y,['#ffd34d','#fff','#ff6ad5'],90,{v:9,sq:true});Snd.play('redeem');await W(900)}else Snd.play('impact')}
  else if(e.t==='pozz'){banner('POZZETTO!',ns.names[e.p]+(e.volo?' lo prende al volo':''));Snd.play('draw');await W(800)}
  else if(e.t==='close'){banner('CHIUSURA!',ns.names[e.p]);Snd.play('win');await W(900)}
  else if(e.t==='round'){Snd.play('redeem')}}
  endFx(ns)}};
function endFx(ns){if(ns.over){if(ns.over.win!=null){Snd.play('win');confetti()}else Snd.play('turn')}}
/* ================= REGISTRI ================= */
const VIEW={regicide:()=>regicideH(),briscola:briscolaH,scopa:scopaH,burraco:burracoH,gang:gangH,saboteur:sabotH,azul:azulH,island:islandH,machiavelli:machH};
const FX={regicide:{pre:regPre,run:(p,n,o)=>runFx(n.ev,o)},briscola:BRFX,scopa:SCFX,burraco:BUFX,gang:GAFX,saboteur:SBFX,azul:AZFX,island:ISFX,machiavelli:MAFX};
function gameClick(a,v){({regicide:regClick,briscola:brisClick,scopa:scopaClick,burraco:burClick,gang:gangClick,saboteur:sabClick,azul:azClick,island:islClick,machiavelli:machClick})[G.g](a,v)}

(()=>{const em=$('.embers');if(RM)return;for(let i=0;i<14;i++){const d=document.createElement('i');d.style.left=Math.random()*100+'%';d.style.animationDuration=9+Math.random()*10+'s';d.style.animationDelay=-Math.random()*15+'s';em.appendChild(d)}})();
window.__rg={get G(){return G},ui,R,ME,dispatch,render,local,myTurn,viewer,needCover,isMine,get Q(){return Q},set SP(v){SP=v}};
if(ME.name)enterHub();else{ui.screen='name';render()}
