[build]
  command = "node scripts/check.js"
  publish = "dist"

# Il service worker non va mai tenuto in cache dal browser: così l'aggiornamento arriva a ogni deploy.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Librerie esterne: il nome contiene l'hash del contenuto, quindi si possono tenere per sempre.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Funzione del locandiere (risposte con Claude): si attiva solo se ANTHROPIC_API_KEY è impostata in Netlify.
[functions]
  directory = "netlify/functions"
