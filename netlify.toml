[build]
  command = "node scripts/check.js"
  publish = "dist"

# Il service worker non va mai tenuto in cache dal browser: così l'aggiornamento arriva a ogni deploy.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
